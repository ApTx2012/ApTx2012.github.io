<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>化学实验室 - 仿真实验平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/chem-lab.css">
  <link rel="stylesheet" href="css/text-light.css">
</head>
<body>
  <div class="lab-header">
    <a href="index.html" class="back-home">
      <i class="fas fa-home"></i> 返回主页
    </a>
    <h1><i class="fas fa-flask"></i> 化学实验室</h1>
    <p class="lab-subtitle">初中化学仿真实验平台</p>
  </div>

  <div class="lab-container">
    <!-- 实验选择侧边栏 -->
    <aside class="lab-sidebar">
      <div class="sidebar-title">实验列表</div>
      <div class="exp-category">
        <div class="category-title">气体制备</div>
        <button class="exp-btn active" data-exp="o2-kmno4">
          <i class="fas fa-vial"></i> 高锰酸钾制氧气
        </button>
        <button class="exp-btn" data-exp="o2-h2o2">
          <i class="fas fa-vial"></i> 过氧化氢制氧气
        </button>
        <button class="exp-btn" data-exp="h2">
          <i class="fas fa-vial"></i> 锌粒制氢气
        </button>
        <button class="exp-btn" data-exp="co2">
          <i class="fas fa-vial"></i> 石灰石制CO₂
        </button>
      </div>
      <div class="exp-category">
        <div class="category-title">金属与溶液</div>
        <button class="exp-btn" data-exp="fe-cuso4">
          <i class="fas fa-flask"></i> 铁置换铜实验
        </button>
        <button class="exp-btn" data-exp="naoh-solution">
          <i class="fas fa-flask"></i> 配制NaOH溶液
        </button>
        <button class="exp-btn" data-exp="naoh-hcl">
          <i class="fas fa-flask"></i> 酸碱中和
        </button>
      </div>
      <div class="exp-category">
        <div class="category-title">燃烧与探究</div>
        <button class="exp-btn" data-exp="burn-condition">
          <i class="fas fa-fire"></i> 燃烧条件探究
        </button>
        <button class="exp-btn" data-exp="mg-burn">
          <i class="fas fa-fire"></i> 镁条燃烧
        </button>
      </div>
    </aside>

    <!-- 实验区域 -->
    <main class="lab-main">
      <!-- 实验台 Canvas -->
      <div class="experiment-stage">
        <canvas id="labCanvas" width="800" height="500"></canvas>
        <div class="stage-controls">
          <button class="ctrl-btn" id="startExp" title="开始实验">
            <i class="fas fa-play"></i>
          </button>
          <button class="ctrl-btn" id="resetExp" title="重置">
            <i class="fas fa-redo"></i>
          </button>
          <button class="ctrl-btn" id="speedExp" title="加速">
            <i class="fas fa-forward"></i>
          </button>
        </div>
      </div>

      <!-- 实验信息面板 -->
      <div class="info-panel">
        <div class="info-section" id="expInfo">
          <h3><i class="fas fa-info-circle"></i> 实验原理</h3>
          <p id="expPrinciple">选择实验查看详情</p>
        </div>
        <div class="info-section" id="expSafety">
          <h3><i class="fas fa-exclamation-triangle"></i> 安全提示</h3>
          <p id="expSafetyTips">请遵守实验室安全规范</p>
        </div>
        <div class="info-section" id="expEquation">
          <h3><i class="fas fa-atom"></i> 化学方程式</h3>
          <p id="expFormula">-</p>
        </div>
      </div>

      <!-- 实验操作面板 -->
      <div class="action-panel">
        <h3><i class="fas fa-hand-pointer"></i> 实验操作</h3>
        <div class="action-steps" id="actionSteps">
          <p class="hint-text">点击"开始实验"按钮开始操作</p>
        </div>
        <div class="gas-display">
          <span>产气量：</span>
          <span id="gasCount">0</span>
          <span> L</span>
        </div>
      </div>
    </main>

    <!-- 器材与试剂栏 -->
    <aside class="lab-materials">
      <div class="sidebar-title">器材库</div>
      <div class="materials-grid">
        <div class="material-item" draggable="true" data-type="beaker">
          <i class="fas fa-burn"></i>
          <span>烧杯</span>
        </div>
        <div class="material-item" draggable="true" data-type="testtube">
          <i class="fas fa-vial"></i>
          <span>试管</span>
        </div>
        <div class="material-item" draggable="true" data-type="flask">
          <i class="fas fa-flask"></i>
          <span>锥形瓶</span>
        </div>
        <div class="material-item" draggable="true" data-type="burner">
          <i class="fas fa-fire-alt"></i>
          <span>酒精灯</span>
        </div>
        <div class="material-item" draggable="true" data-type="tube">
          <i class="fas fa-arrow-down"></i>
          <span>导管</span>
        </div>
        <div class="material-item" draggable="true" data-type="gastank">
          <i class="fas fa-wind"></i>
          <span>集气瓶</span>
        </div>
      </div>
      <div class="sidebar-title" style="margin-top:20px">试剂库</div>
      <div class="reagents-grid" id="reagentsGrid">
        <!-- 动态加载 -->
      </div>
    </aside>
  </div>

  <!-- 结果弹窗 -->
  <div class="result-modal" id="resultModal">
    <div class="modal-content">
      <h2 id="modalTitle">实验结果</h2>
      <div id="modalBody"></div>
      <button class="modal-close" id="modalClose">确定</button>
    </div>
  </div>

  <!-- WASM 加载提示 -->
  <div class="lab-loading" id="labLoading">
    <div class="loading-spinner"></div>
    <p>化学计算模块加载中...</p>
  </div>

  <script src="js/chem-lab.js"></script>
</body>
</html>
