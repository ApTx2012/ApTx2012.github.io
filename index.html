<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#05060f" />
    <meta name="description" content="ApTx2012 的 GitHub 数据可视化驾驶舱" />
    <title>ApTx2012 · GitHub Observatory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>" />
  </head>
  <body>
    <!-- 3D 星系背景层 -->
    <canvas id="galaxy"></canvas>

    <!-- 赛博朋克叠加层：网格 + 扫描线 -->
    <div class="cyber-overlay" aria-hidden="true">
      <div class="cyber-grid"></div>
      <div class="cyber-scanline"></div>
      <div class="cyber-vignette"></div>
    </div>

    <!-- 主屏 -->
    <header class="hero" id="hero">
      <div class="hero__badge" id="heroBadge">
        <span class="dot"></span>
        <span>GITHUB OBSERVATORY · ONLINE</span>
      </div>

      <h1 class="hero__title" id="heroTitle">
        <span class="glitch" data-text="ApTx2012">ApTx2012</span>
      </h1>

      <p class="hero__subtitle" id="heroSubtitle">初始化数据链路…</p>

      <div class="hero__stats" id="heroStats">
        <div class="stat-card" data-stat="stars">
          <div class="stat-card__value" data-value="0">0</div>
          <div class="stat-card__label">TOTAL STARS</div>
        </div>
        <div class="stat-card" data-stat="commits">
          <div class="stat-card__value" data-value="0">0</div>
          <div class="stat-card__label">COMMITS / YEAR</div>
        </div>
        <div class="stat-card" data-stat="repos">
          <div class="stat-card__value" data-value="0">0</div>
          <div class="stat-card__label">PUBLIC REPOS</div>
        </div>
        <div class="stat-card" data-stat="prs">
          <div class="stat-card__value" data-value="0">0</div>
          <div class="stat-card__label">PULL REQUESTS</div>
        </div>
      </div>

      <div class="hero__scroll">
        <span>SCROLL</span>
        <div class="hero__scroll-line"></div>
      </div>
    </header>

    <!-- 数据面板区 -->
    <main class="panels" id="panels">
      <section class="panel" data-panel="contributions">
        <div class="panel__head">
          <span class="panel__index">01</span>
          <h2 class="panel__title">贡献热力</h2>
          <span class="panel__meta" id="contribTotal"></span>
        </div>
        <div class="panel__body">
          <div class="chart" id="chart-contributions"></div>
        </div>
      </section>

      <section class="panel" data-panel="languages">
        <div class="panel__head">
          <span class="panel__index">02</span>
          <h2 class="panel__title">语言构成</h2>
        </div>
        <div class="panel__body">
          <div class="chart" id="chart-languages"></div>
        </div>
      </section>

      <section class="panel" data-panel="repos">
        <div class="panel__head">
          <span class="panel__index">03</span>
          <h2 class="panel__title">仓库星榜</h2>
        </div>
        <div class="panel__body">
          <div class="chart" id="chart-repos"></div>
        </div>
      </section>

      <section class="panel" data-panel="activity">
        <div class="panel__head">
          <span class="panel__index">04</span>
          <h2 class="panel__title">活动流</h2>
        </div>
        <div class="panel__body">
          <ul class="activity-list" id="activity-list"></ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span id="footerInfo">—</span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
