name: Build Rust WASM

on:
  push:
    paths:
      - 'wasm-2048/**'
      - 'wasm-chem/**'
      - '.github/workflows/build-wasm.yml'
  pull_request:
    paths:
      - 'wasm-2048/**'
      - 'wasm-chem/**'
  workflow_dispatch:

jobs:
  build-wasm-2048:
    name: Build wasm-2048
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm-2048
        working-directory: ./wasm-2048
        run: wasm-pack build --target web --out-dir pkg

      - name: Upload wasm-2048 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-2048-pkg
          path: wasm-2048/pkg/

  build-wasm-chem:
    name: Build wasm-chem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm-chem
        working-directory: ./wasm-chem
        run: wasm-pack build --target web --out-dir pkg

      - name: Upload wasm-chem artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-chem-pkg
          path: wasm-chem/pkg/

  commit-and-push:
    name: Commit compiled WASM
    needs: [build-wasm-2048, build-wasm-chem]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download wasm-2048 artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-2048-pkg
          path: wasm-2048/pkg/

      - name: Download wasm-chem artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-chem-pkg
          path: wasm-chem/pkg/

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit changes
        run: |
          git add wasm-2048/pkg/ wasm-chem/pkg/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build WASM: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
